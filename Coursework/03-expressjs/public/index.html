<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Express exercise</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 40px auto; max-width: 640px; }
      li { padding: 6px 0; border-bottom: 1px solid #e5e7eb; }
      form { display: flex; gap: 8px; margin-bottom: 20px; }
      input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
      button { padding: 8px 14px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; }
    </style>
  </head>
  <body>
    <h1>Members</h1>
    <form id="add">
      <input name="name" placeholder="Name" required />
      <input name="email" type="email" placeholder="Email" required />
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>

    <script>
      const list = document.getElementById('list')

      const load = async () => {
        const res = await fetch('/api/members')
        const members = await res.json()
        list.innerHTML = members
          .map((m) => `<li>${m.name} - ${m.email} <em>(${m.status})</em></li>`)
          .join('')
      }

      document.getElementById('add').addEventListener('submit', async (event) => {
        event.preventDefault()
        const data = Object.fromEntries(new FormData(event.target))
        await fetch('/api/members', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
        event.target.reset()
        load()
      })

      load()
    </script>
  </body>
</html>
